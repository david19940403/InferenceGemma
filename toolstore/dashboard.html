<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tool Store</title>
<style>body{margin:0;background:#07111d;color:#e5eef7;font:14px system-ui}main{max-width:1050px;margin:auto;padding:32px}h1{color:#39d9e8}section{display:grid;grid-template-columns:340px 1fr;gap:24px}.card{background:#101d2a;border:1px solid #263747;border-radius:14px;padding:18px;margin-bottom:12px}input,textarea{box-sizing:border-box;width:100%;margin:5px 0 13px;padding:10px;background:#07111d;color:#fff;border:1px solid #34495e;border-radius:7px}button{background:#14a9bd;color:white;border:0;padding:10px 14px;border-radius:7px;cursor:pointer}.danger{background:#692d3b;float:right}code{color:#67e8a5;overflow-wrap:anywhere}@media(max-width:750px){section{grid-template-columns:1fr}}</style></head>
<body><main><h1>⚡ Tool Store</h1><section><form id="form" class="card"><h2>Registrar tool</h2><input id="name" placeholder="Nombre técnico" required><input id="host" placeholder="Host destino" required><input id="user" value="root" placeholder="Usuario SSH"><input id="command" placeholder="/opt/agent-tools/script.sh {arg}" required><textarea id="description" placeholder="Descripción semántica" required></textarea><textarea id="parameters" rows="8">{"type":"object","properties":{},"required":[]}</textarea><button>Guardar</button></form><div><h2>Catálogo</h2><div id="tools"></div></div></section></main>
<script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const ts=await(await fetch('/api/tools')).json();tools.innerHTML=ts.map(t=>`<div class="card"><button class="danger" onclick="del(${t.id})">Eliminar</button><b>${esc(t.name)}</b> · ${esc(t.target_host)}<p>${esc(t.description)}</p><code>${esc(t.command_template)}</code></div>`).join('')||'<p>Sin herramientas.</p>'}async function del(id){if(confirm('¿Eliminar?')){await fetch('/api/tools/'+id,{method:'DELETE'});load()}}form.onsubmit=async e=>{e.preventDefault();const body={name:name.value,target_host:host.value,user:user.value,command_template:command.value,description:description.value,parameters:JSON.parse(parameters.value)};const r=await fetch('/api/tools',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)alert((await r.json()).error);else{form.reset();user.value='root';load()}};load()</script></body></html>
