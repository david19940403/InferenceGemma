<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tool Store · Infraestructura</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#0b1017;color:#e5edf7}*{box-sizing:border-box}body{margin:0}header{padding:28px 6%;border-bottom:1px solid #263140;display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:0}small{color:#8da1b8}main{max-width:1250px;margin:32px auto;padding:0 24px;display:grid;grid-template-columns:350px 1fr;gap:32px}section,article{background:#121c29;border:1px solid #28364a;border-radius:14px;padding:24px}h2{font-size:18px;margin:0 0 20px}label{display:block;font-size:12px;color:#a9bad1;margin-top:16px}input,textarea,button{font:inherit;border-radius:7px;padding:11px;border:1px solid #34465e}input,textarea{display:block;background:#0b121d;color:#e5edf7;width:100%;margin-top:7px}textarea{resize:vertical}button{cursor:pointer;color:#061c1e;background:#68e4ca;font-weight:600;margin-top:16px}button.secondary{color:#c4d1e2;background:#202f43}article{margin:12px 0}article h3{color:#68e4ca;overflow-wrap:anywhere;font-size:15px}code{display:block;background:#09111c;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:#afbdd1}p{line-height:1.5}#notice{white-space:pre-wrap;color:#f4c875}#catalog{min-width:0}.search{display:flex;gap:10px}.search input{flex:1;min-width:0}.search button{margin:7px 0 0}#token{width:240px}#results{white-space:pre-wrap;font:12px monospace;overflow-wrap:anywhere}footer{color:#8da1b8;font-size:12px;margin-top:20px}@media(max-width:800px){main{grid-template-columns:1fr}header{display:block}#token{width:100%}}
</style>
<header><div><h1>◈ Tool Store</h1><small>Catálogo de infraestructura · Go / SQLite</small></div><input id="token" type="password" placeholder="Token de acceso (opcional)" aria-label="Token de acceso"></header>
<main><div><section><h2>Registrar herramienta</h2><form id="create">
<label>Nombre técnico<input id="nombre" required pattern="[a-z][a-z0-9_]{0,63}" placeholder="estado_fedora"></label>
<label>Host SSH<input id="target_host" required placeholder="macbook-fedora.vpn"></label>
<label>Descripción<textarea id="descripcion" required rows="3" placeholder="Consulta el estado del sistema Fedora"></textarea></label>
<label>Comando / script<input id="command_template" required placeholder="/opt/agent-tools/system_status.sh"></label>
<label>Parámetros JSON Schema<textarea id="parameters" rows="7" spellcheck="false">{"type":"object","properties":{},"required":[]}</textarea></label>
<button>Guardar herramienta</button></form></section><footer>Los valores de parámetros se validan y escapan en Android. Registra solo scripts de confianza.</footer></div>
<div id="catalog"><h2>Herramientas registradas <small id="count"></small></h2><div id="notice" role="status" aria-live="polite"></div><div id="list"></div>
<section><h2>Probar recuperación · K ≤ 3</h2><form class="search" id="search"><input id="query" required placeholder="Consulta el estado de Fedora" aria-label="Consulta de búsqueda"><button>Buscar</button></form><p><small>Índice vectorial local TF-IDF con similitud coseno.</small></p><pre id="results"></pre></section></div></main>
<script>
const $=id=>document.getElementById(id);const notice=m=>$('notice').textContent=m;
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...($('token').value?{Authorization:'Bearer '+$('token').value}:{})}});if(!r.ok){let e;try{e=(await r.json()).error}catch{e='Error HTTP '+r.status}throw Error(e)}return r.status===204?null:r.json()}
function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el}
async function load(){try{const tools=await api('/api/tools');$('list').replaceChildren();$('count').textContent='('+tools.length+')';if(!tools.length)$('list').append(node('p','Aún no hay herramientas. Registra un script para empezar.'));for(const t of tools){const card=node('article','');card.append(node('h3',t.nombre),node('small',t.target_host),node('p',t.descripcion),node('code',t.command_template));const b=node('button','Eliminar');b.className='secondary';b.onclick=async()=>{if(!confirm('¿Eliminar '+t.nombre+'?'))return;try{await api('/api/tools/'+t.id,{method:'DELETE'});await load();notice('Herramienta eliminada')}catch(e){notice(e.message)}};card.append(b);$('list').append(card)}}catch(e){notice(e.message)}}
$('create').onsubmit=async e=>{e.preventDefault();try{const t={};for(const key of ['nombre','target_host','descripcion','command_template'])t[key]=$(key).value.trim();t.parameters=JSON.parse($('parameters').value);await api('/api/tools',{method:'POST',body:JSON.stringify(t)});$('create').reset();await load();notice('Herramienta registrada')}catch(e){notice(e.message)}};
$('search').onsubmit=async e=>{e.preventDefault();try{$('results').textContent=JSON.stringify(await api('/tools/search',{method:'POST',body:JSON.stringify({query:$('query').value,top_k:3})}),null,2)}catch(e){notice(e.message)}};$('token').onchange=load;load();
</script></html>
